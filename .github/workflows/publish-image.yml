name: Publish image

# Builds the existing Dockerfile and pushes it to GHCR so deployments can run a
# published image instead of building from source.
#
# Tags:
#   main branch  -> :latest and an immutable :main-<short-sha>
#   v* git tag   -> :<version> (e.g. :0.1.0), :<major>.<minor>, and :latest
#   pull request -> built only, never pushed (this is the Dockerfile's CI)
#
# Production pins an immutable tag — :latest is for convenience and local trials
# only. See docs/MCP_HOSTED_CONNECTOR.md in the captureze-one-shot repo.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GITHUB_TOKEN needs this to push to ghcr.io; it is not granted by default.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # A pull request builds to prove the Dockerfile still works, but must not
      # be able to publish — forks would otherwise push to our registry.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Captureze MCP server
            org.opencontainers.image.description=Model Context Protocol server for Captureze
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 costs little to build here and saves anyone on Apple silicon
          # from running the image under emulation.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
